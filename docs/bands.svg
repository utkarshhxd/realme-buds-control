<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .lbl   { fill: #8b949e; font-size: 12px; }
    .title { fill: #8b949e; font-size: 13px; font-weight: 600; }
    .axis  { stroke: #8b949e; stroke-opacity: .35; }
    .tick  { fill: #8b949e; font-size: 10px; opacity: .8; }
    .stock { fill: #e05c5c; }
    .ours  { fill: #4a9eda; }
    .gap   { fill: #e0a35c; fill-opacity: .15; stroke: #e0a35c; stroke-opacity: .45; stroke-dasharray: 3 3; }
    .gaptx { fill: #c98b3f; font-size: 11px; font-style: italic; }
  </style>

  <!-- frequency axis -->
  <line class="axis" x1="60" y1="215" x2="760" y2="215"/>
  <g class="tick" text-anchor="middle">
    <text x="60"  y="232">20</text>
    <text x="175" y="232">62</text>
    <text x="316" y="232">250</text>
    <text x="456" y="232">1k</text>
    <text x="597" y="232">4k</text>
    <text x="667" y="232">8k</text>
    <text x="737" y="232">16k</text>
    <text x="410" y="248" fill="#8b949e" opacity=".7">frequency (Hz, logarithmic)</text>
  </g>

  <!-- the two blind spots in the stock layout -->
  <rect class="gap" x="316" y="48" width="140" height="34" rx="4"/>
  <rect class="gap" x="456" y="48" width="141" height="34" rx="4"/>
  <text class="gaptx" x="386" y="40" text-anchor="middle">boxiness</text>
  <text class="gaptx" x="526" y="40" text-anchor="middle">vocal presence</text>

  <!-- stock app bands -->
  <text class="title" x="60" y="80">realme Link</text>
  <text class="lbl"   x="60" y="97">six fixed bands</text>
  <line class="axis" x1="60" y1="65" x2="760" y2="65" stroke-dasharray="2 4"/>
  <g class="stock">
    <circle cx="175" cy="65" r="6"/>
    <circle cx="316" cy="65" r="6"/>
    <circle cx="456" cy="65" r="6"/>
    <circle cx="597" cy="65" r="6"/>
    <circle cx="667" cy="65" r="6"/>
    <circle cx="737" cy="65" r="6"/>
  </g>

  <!-- this tool -->
  <text class="title" x="60" y="170">This tool</text>
  <text class="lbl"   x="60" y="187">any centre, 20 Hz - 20 kHz</text>
  <line class="axis" x1="60" y1="155" x2="760" y2="155" stroke-dasharray="2 4"/>
  <g class="ours">
    <circle cx="162" cy="155" r="6"/>
    <circle cx="242" cy="155" r="6"/>
    <circle cx="341" cy="155" r="6"/>
    <circle cx="483" cy="155" r="6"/>
    <circle cx="574" cy="155" r="6"/>
    <circle cx="661" cy="155" r="6"/>
  </g>
  <g class="tick" text-anchor="middle" fill="#4a9eda">
    <text x="162" y="140">55</text>
    <text x="242" y="140">120</text>
    <text x="341" y="140">320</text>
    <text x="483" y="140">1.3k</text>
    <text x="574" y="140">3.2k</text>
    <text x="661" y="140">7.5k</text>
  </g>
  <text class="lbl" x="410" y="207" text-anchor="middle" font-style="italic">bands placed where the problems actually are</text>
</svg>
